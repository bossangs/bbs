server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;
    client_max_body_size 20m;

    location ~* ^/(conf|log|tmp|tool|data|plugin)(/|$) { deny all; }
    location ~* ^/install/(?!index\.php$) { deny all; }
    location ~* ^/upload/.*\.(php[0-9]?|phtml|phar)$ { deny all; }
    location ~* \.(sql|log|ini|bak|conf|config|dist|example|lock)$ { deny all; }
    location ~ /\. { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_read_timeout 120s;
        fastcgi_pass app:9000;
    }
}
